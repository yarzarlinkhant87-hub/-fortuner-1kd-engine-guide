<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#ef4444" stroke-width="8"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="14 10"/>
  
  <!-- Outer Gear Teeth -->
  <g fill="#475569" opacity="0.6">
    <circle cx="256" cy="70" r="16"/>
    <circle cx="256" cy="442" r="16"/>
    <circle cx="70" cy="256" r="16"/>
    <circle cx="442" cy="256" r="16"/>
    <circle cx="125" cy="125" r="14"/>
    <circle cx="387" cy="387" r="14"/>
    <circle cx="125" cy="387" r="14"/>
    <circle cx="387" cy="125" r="14"/>
  </g>

  <!-- Central Diesel Piston / Engine Block Shield -->
  <g transform="translate(106, 96)">
    <!-- Shield / Badge -->
    <path d="M 150 20 L 270 55 L 270 190 Q 270 280 150 320 Q 30 280 30 190 L 30 55 Z" fill="url(#metalGrad)" stroke="#fca5a5" stroke-width="4"/>
    
    <!-- Piston Silhouette inside -->
    <rect x="95" y="80" width="110" height="75" rx="12" fill="#ffffff" opacity="0.95"/>
    <rect x="85" y="105" width="130" height="8" rx="4" fill="#ef4444"/>
    <rect x="85" y="122" width="130" height="8" rx="4" fill="#ef4444"/>
    <rect x="85" y="139" width="130" height="8" rx="4" fill="#ef4444"/>
    
    <!-- Connecting Rod -->
    <path d="M 135 155 L 135 240 L 165 240 L 165 155 Z" fill="#e2e8f0"/>
    <circle cx="150" cy="250" r="26" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="150" cy="250" r="12" fill="#0f172a"/>
    
    <!-- Twin Spark/Injection Flames -->
    <path d="M 150 35 Q 165 55 150 72 Q 135 55 150 35 Z" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#fbbf24" text-anchor="middle" letter-spacing="3">GREATSTAR</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="19" fill="#f8fafc" text-anchor="middle" letter-spacing="2">Z.N.W DIESEL PRO</text>
</svg>
