<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Engine Gear Silhouette -->
  <g transform="translate(256,230) scale(1.1)">
    <circle r="110" fill="none" stroke="url(#gearGrad)" stroke-width="24" stroke-dasharray="25 15" stroke-opacity="0.75"/>
    <circle r="65" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
    <circle r="30" fill="#0f172a" stroke="#f59e0b" stroke-width="6"/>
  </g>

  <!-- Cross Wrench Symbol -->
  <g transform="translate(256,230) rotate(-45) scale(1.3)" stroke="url(#wrenchGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-50 -50 L50 50" />
    <path d="M-60 -40 C-80 -40 -90 -20 -80 0 C-70 20 -50 20 -40 0 L-20 -20" fill="#0f172a" />
    <path d="M60 40 C80 40 90 20 80 0 C70 -20 50 -20 40 0 L20 20" fill="#0f172a" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">FORTUNER</text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#38bdf8" text-anchor="middle" letter-spacing="4">ENGINE SPEC</text>
</svg>
